# main ブランチへの push で、テスト → ビルド → GitHub Pages へデプロイします。
# 事前に リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にしてください。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Test
        run: npm test
      - name: Build
        # base_path: ユーザーサイト(<user>.github.io)なら ""、プロジェクトサイトなら "/<repo>"
        # base_url : 公開URL（独自ドメインを設定した場合はそのURL）
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
