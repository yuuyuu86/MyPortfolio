<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Wi-fier — concept visual</title><desc id="desc">AR空間の中にWi-Fiの強度を示す電波リングを浮かべたコンセプトビジュアル。実際のアプリ画面ではありません。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1F06AC"/><stop offset="1" stop-color="#0F42C0"/></linearGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0v44" fill="none" stroke="#5882E8" stroke-opacity=".22"/></pattern></defs><rect width="1200" height="760" fill="url(#bg)"/><rect width="1200" height="760" fill="url(#grid)"/><path d="M55 115h1090" stroke="#E3EF4F" stroke-opacity=".55"/><text x="62" y="80" fill="#E3EF4F" font-family="Arial,sans-serif" font-size="19" letter-spacing="4">YUTA PORTFOLIO  /  PROJECT STUDY</text><g><path d="M320 230 880 210v360l-560 20z" fill="#0F42C0" stroke="#5882E8" stroke-width="6"/><path d="M430 310q170-170 340 0M485 365q115-115 230 0M545 420q55-55 110 0" fill="none" stroke="#E3EF4F" stroke-width="18" stroke-linecap="round"/><circle cx="600" cy="475" r="16" fill="#E3EF4F"/><circle cx="390" cy="520" r="11" fill="#5882E8"/><circle cx="800" cy="290" r="11" fill="#5882E8"/></g><text x="62" y="666" fill="#E3EF4F" font-family="Arial,sans-serif" font-size="34" font-weight="700">SIGNAL, MADE VISIBLE</text><text x="62" y="710" fill="#E3EF4F" fill-opacity=".72" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">CONCEPT VISUAL  —  NOT A SCREENSHOT</text><text x="1140" y="710" text-anchor="end" fill="#E3EF4F" font-family="Arial,sans-serif" font-size="17">WI-FIER</text></svg>